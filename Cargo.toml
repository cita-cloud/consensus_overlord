[package]
name = "consensus"
version = "6.7.5"
authors = ["Rivtower Technologies <contact@rivtower.com>"]
license = "Apache-2.0"
edition = "2024"

[dependencies]
overlord = "0.4"
clap = { version = "4.6", features = ["derive"] }
tonic = "0.14"
prost = "0.14"
tokio = { version = "1.50", features = ["full"] }
toml = "1.0"
serde = "1.0"
serde_derive = "1.0"
bytes = { version = "1.11", features = ["serde"] }
async-trait = "0.1"
ophelia = "0.3"
ophelia-blst = "0.3"
ophelia-secp256k1 = "0.3"
hex = "0.4"
derive_more = { version = "2.1", features = ["full"] }
creep = "0.2"                                          # match with overlord
rlp = "0.5"                                            # match with overlord
libsm = "0.6"
tower = "0.5"
tracing = "0.1"

cloud-util = { package = "cloud-util", git = "https://github.com/cita-cloud/cloud-common-rs", branch = "update" }
cita_cloud_proto = { package = "cita_cloud_proto", git = "https://github.com/cita-cloud/cloud-common-rs", branch = "update" }

[profile.release.package."*"]
# Set the default for dependencies.
debug = 0

[profile.release]
# Add debug info -- line tables only
debug = 1
